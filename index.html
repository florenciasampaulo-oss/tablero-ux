<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tablero · Área UX</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",sans-serif;font-size:13px;background:#FAF9F6;color:#2C2C2A;padding:2rem}
.header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:1.25rem;flex-wrap:wrap;gap:8px}
h1{font-size:18px;font-weight:500}
.sub{font-size:11px;color:#5F5E5A;margin-top:3px}
.badge-act{font-size:11px;background:#E1F5EE;color:#0F6E56;padding:3px 10px;border-radius:20px}
.error-box{background:#FAECE7;color:#712B13;border-radius:8px;padding:10px 14px;font-size:12px;margin-bottom:1rem;display:none}
.sec{font-size:11px;font-weight:500;color:#534AB7;text-transform:uppercase;letter-spacing:0.05em;margin:1.5rem 0 0.75rem;border-bottom:1px solid #EEEDFE;padding-bottom:5px}
.summary-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:1.25rem}
.sc{background:#F1EFE8;border-radius:8px;padding:10px;text-align:center}
.sc .num{font-size:22px;font-weight:500}
.sc .lbl{font-size:10px;color:#5F5E5A;margin-top:2px}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.col{background:#F4F3EE;border-radius:8px;padding:8px}
.col-title{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:7px;display:flex;justify-content:space-between;padding:0 2px}
.card{background:#fff;border:0.5px solid #E2E0D8;border-radius:7px;padding:7px 9px;margin-bottom:6px}
.card .tag{font-size:10px;background:#F1EFE8;color:#5F5E5A;padding:1px 5px;border-radius:10px;margin-bottom:4px;display:inline-block}
.card .tt{font-weight:500;font-size:11px;margin-bottom:3px;line-height:1.3}
.card .mt{display:flex;justify-content:space-between;align-items:center}
.card .rp{font-size:10px;color:#5F5E5A}
.bp{font-size:10px;padding:1px 5px;border-radius:10px;font-weight:500}
.bp-Alta{background:#FAECE7;color:#712B13}
.bp-Media{background:#FAEEDA;color:#633806}
.bp-Baja{background:#F1EFE8;color:#444441}
.empty{font-size:10px;color:#B4B2A9;padding:4px 2px}
.seg-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.seg-card{background:#fff;border:0.5px solid #E2E0D8;border-radius:10px;padding:12px}
.seg-card h3{font-size:11px;font-weight:500;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.seg-row{display:flex;justify-content:space-between;align-items:flex-start;padding:6px 0;border-bottom:0.5px solid #E2E0D8;gap:6px}
.seg-row:last-child{border-bottom:none}
.seg-row .info{flex:1}
.id-t{font-size:10px;color:#5F5E5A;margin-bottom:1px}
.tt2{font-size:11px;font-weight:500;line-height:1.3}
.rp2{font-size:10px;color:#5F5E5A;margin-top:1px}
.right{text-align:right;flex-shrink:0}
.be{font-size:10px;padding:2px 6px;border-radius:10px;font-weight:500;white-space:nowrap}
.be-bl{background:#FAECE7;color:#712B13}
.be-ec{background:#E6F1FB;color:#0C447C}
.be-vh{background:#FAECE7;color:#712B13}
.be-vp{background:#FAEEDA;color:#633806}
.fecha{font-size:10px;color:#5F5E5A;margin-top:3px}
.persona-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pc{background:#F4F3EE;border-radius:8px;padding:10px 12px}
.pn{font-size:12px;font-weight:500;margin-bottom:7px;display:flex;justify-content:space-between}
.cnt{font-size:10px;font-weight:400;color:#5F5E5A}
.pt{font-size:11px;padding:4px 0;border-bottom:0.5px solid #E2E0D8;display:flex;justify-content:space-between;gap:4px}
.pt:last-child{border-bottom:none}
.pt-t{flex:1;line-height:1.3}
.no-data{font-size:11px;color:#B4B2A9;padding:6px 0}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>Tablero · Área UX</h1>
    <div class="sub">Subsecretaría de Promoción Humana · Ministerio de Capital Humano</div>
  </div>
  <div id="badge-act" class="badge-act" style="display:none"></div>
</div>

<div class="error-box" id="error-box"></div>

<div class="summary-grid" id="summary-grid"></div>
<div class="sec">Estado general de tareas</div>
<div class="board" id="board"></div>
<div class="sec">Seguimiento semanal</div>
<div class="seg-grid" id="seg-grid"></div>
<div class="sec">Tareas por persona</div>
<div class="persona-grid" id="persona-grid"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbz-t6zcAtr7Nv-JpdT65Z-Sotzd6M7lSCbB1p9KEgK7OVNAQzfqDJLW5lufIIZtV_HkEQ/exec";
const ESTADOS = ["Pendiente","En curso","En revisión","Bloqueada","Completada"];
const COLORES = {"Pendiente":"#5F5E5A","En curso":"#185FA5","En revisión":"#854F0B","Bloqueada":"#993C1D","Completada":"#3B6D11"};

function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}

function diasHasta(str){
  if(!str)return null;
  const p=str.split("/");
  if(p.length!==3)return null;
  const f=new Date(parseInt(p[2]),parseInt(p[1])-1,parseInt(p[0]));
  const h=new Date();h.setHours(0,0,0,0);
  return Math.ceil((f-h)/86400000);
}

function renderizar(data){
  const tareas=data.tareas||[];
  const badge=document.getElementById("badge-act");
  badge.textContent="Actualizado: "+(data.actualizadoTexto||"—");
  badge.style.display="inline-block";

  const conteos={};ESTADOS.forEach(e=>conteos[e]=0);
  tareas.forEach(t=>{if(conteos[t.estado]!==undefined)conteos[t.estado]++});
  document.getElementById("summary-grid").innerHTML=ESTADOS.map(e=>`
    <div class="sc"><div class="num" style="color:${COLORES[e]}">${conteos[e]}</div><div class="lbl">${e}</div></div>`).join("");

  document.getElementById("board").innerHTML=ESTADOS.map(estado=>{
    const ts=tareas.filter(t=>t.estado===estado);
    return`<div class="col">
      <div class="col-title" style="color:${COLORES[estado]}"><span>${estado}</span><span>${ts.length}</span></div>
      ${ts.length?ts.map(t=>`<div class="card">
        <span class="tag">${esc(t.proyecto)}</span>
        <div class="tt">${esc(t.id)} · ${esc(t.tarea)}</div>
        <div class="mt"><span class="rp">${esc(t.responsable)}</span>${t.prioridad?`<span class="bp bp-${esc(t.prioridad)}">${esc(t.prioridad)}</span>`:""}</div>
      </div>`).join(""):`<div class="empty">Sin tareas</div>`}
    </div>`;
  }).join("");

  const activas=tareas.filter(t=>t.estado==="En curso"||t.estado==="Bloqueada").sort((a,b)=>a.estado==="Bloqueada"?-1:1);
  const vencen=tareas.filter(t=>t.estado!=="Completada"&&t.fecha).map(t=>({...t,dias:diasHasta(t.fecha)})).filter(t=>t.dias!==null&&t.dias>=0&&t.dias<=7).sort((a,b)=>a.dias-b.dias);

  document.getElementById("seg-grid").innerHTML=`
    <div class="seg-card">
      <h3><span class="dot" style="background:#185FA5"></span>En curso y bloqueadas</h3>
      ${activas.length?activas.map(t=>`<div class="seg-row">
        <div class="info"><div class="id-t">${esc(t.id)} · ${esc(t.proyecto)}</div><div class="tt2">${esc(t.tarea)}</div><div class="rp2">${esc(t.responsable)}</div></div>
        <div class="right"><span class="be ${t.estado==="Bloqueada"?"be-bl":"be-ec"}">${esc(t.estado)}</span>${t.fecha?`<div class="fecha">${esc(t.fecha)}</div>`:""}</div>
      </div>`).join(""):`<div class="no-data">Sin tareas activas</div>`}
    </div>
    <div class="seg-card">
      <h3><span class="dot" style="background:#EF9F27"></span>Vencen esta semana</h3>
      ${vencen.length?vencen.map(t=>`<div class="seg-row">
        <div class="info"><div class="id-t">${esc(t.id)} · ${esc(t.proyecto)}</div><div class="tt2">${esc(t.tarea)}</div><div class="rp2">${esc(t.responsable)}</div></div>
        <div class="right"><span class="be ${t.dias===0?"be-vh":"be-vp"}">${t.dias===0?"Hoy":"En "+t.dias+" d"}</span><div class="fecha">${esc(t.fecha)}</div></div>
      </div>`).join(""):`<div class="no-data">Sin vencimientos esta semana</div>`}
    </div>`;

  const porPersona={};
  tareas.forEach(t=>{
    if(t.estado==="Completada")return;
    t.responsable.split(",").map(n=>n.trim()).filter(Boolean).forEach(n=>{
      if(!porPersona[n])porPersona[n]=[];
      porPersona[n].push(t);
    });
  });
  const personas=Object.entries(porPersona).sort((a,b)=>b[1].length-a[1].length);
  document.getElementById("persona-grid").innerHTML=personas.length?personas.map(([nombre,ts])=>`
    <div class="pc">
      <div class="pn"><span>${esc(nombre)}</span><span class="cnt">${ts.length} tarea${ts.length!==1?"s":""}</span></div>
      ${ts.map(t=>`<div class="pt"><span class="pt-t">${esc(t.id)} · ${esc(t.tarea)}</span><span style="font-size:10px;color:${COLORES[t.estado]};white-space:nowrap">${esc(t.estado)}</span></div>`).join("")}
    </div>`).join(""):`<div class="no-data">Sin datos</div>`;
}

fetch(API_URL)
  .then(r=>{if(!r.ok)throw new Error("Error al conectar");return r.json();})
  .then(data=>renderizar(data))
  .catch(err=>{
    const eb=document.getElementById("error-box");
    eb.textContent="No se pudieron cargar los datos: "+err.message;
    eb.style.display="block";
  });
</script>
</body>
</html>
