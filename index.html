<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tablero · Área UX</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#fff;color:#1a1a1a;font-size:14px;line-height:1.5;min-height:100vh}

/* TOPBAR */
.topbar{padding:1.5rem 2rem 0;border-bottom:1px solid #1a1a1a;background:#fff;position:sticky;top:0;z-index:10}
.page-title{font-size:26px;font-weight:600;color:#1a1a1a;margin-bottom:3px}
.page-sub{font-size:13px;color:#6b6b6b;margin-bottom:1rem}
.tabs{display:flex;gap:0}
.tab{padding:10px 20px;font-size:13px;font-weight:500;color:#6b6b6b;border-bottom:2px solid transparent;cursor:pointer;display:flex;align-items:center;gap:7px;transition:all 0.12s;user-select:none}
.tab.active{color:#1a1a1a;border-bottom:2px solid #1a1a1a}
.tab:hover:not(.active){color:#1a1a1a}

/* CONTENT */
.content{padding:1.75rem 2rem;display:none}
.content.active{display:block}

/* SUMMARY CARDS */
.summary-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:2rem}
.scard{background:#fff;border:1px solid #1a1a1a;border-radius:6px;padding:14px 16px}
.scard-num{font-size:28px;font-weight:600}
.scard-lbl{font-size:12px;color:#6b6b6b;margin-top:3px}

/* KANBAN */
.kanban{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.kcol{background:#f7f7f5;border:1px solid #e5e5e5;border-radius:6px;padding:10px}
.kcol-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;padding:0 2px}
.kcol-count{background:#fff;border:1px solid #e5e5e5;border-radius:4px;font-size:11px;padding:1px 6px;color:#6b6b6b}
.kcard{background:#fff;border:1px solid #e5e5e5;border-radius:6px;padding:10px 12px;margin-bottom:7px;cursor:pointer;transition:border-color 0.12s}
.kcard:hover{border-color:#1a1a1a}
.kcard.bloq{border-left:3px solid #1a1a1a;border-radius:0 6px 6px 0}
.kcard.done{opacity:0.5}
.kcard-proj{font-size:11px;color:#6b6b6b;margin-bottom:4px;font-weight:500}
.kcard-title{font-size:13px;font-weight:500;color:#1a1a1a;line-height:1.35;margin-bottom:8px}
.kcard-footer{display:flex;justify-content:space-between;align-items:center}
.kcard-resp{font-size:12px;color:#6b6b6b}
.kcard-more{font-size:11px;color:#aaa;display:flex;align-items:center;gap:4px;margin-top:8px;padding-top:7px;border-top:1px solid #f0f0f0}
.empty-col{font-size:12px;color:#aaa;padding:4px 2px}

/* BADGES */
.badge{font-size:11px;padding:2px 7px;border-radius:4px;font-weight:500;border:1px solid;white-space:nowrap}
.b-Alta{background:#fff0ee;color:#9b2c1a;border-color:#f5bdb5}
.b-Media{background:#fff8ee;color:#8a4e0a;border-color:#f5dab5}
.b-Baja{background:#f5f5f5;color:#5a5a5a;border-color:#d5d5d5}
.est-Pendiente{background:#f5f5f5;color:#5a5a5a;border-color:#d5d5d5}
.est-En.curso{background:#eef5ff;color:#1a4fa0;border-color:#b5cfee}
.est-En.revisión{background:#fff8ee;color:#8a4e0a;border-color:#f5dab5}
.est-Bloqueada{background:#fff0ee;color:#9b2c1a;border-color:#f5bdb5}
.est-Completada{background:#f0f9ee;color:#2a6a1a;border-color:#b5ddb5}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:100;display:none;align-items:center;justify-content:center;padding:2rem}
.modal-overlay.open{display:flex}
.modal{background:#fff;border:1px solid #1a1a1a;border-radius:8px;padding:1.75rem;width:100%;max-width:480px;max-height:85vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;gap:12px}
.modal-proj{font-size:12px;color:#6b6b6b;margin-bottom:4px;font-weight:500}
.modal-title{font-size:17px;font-weight:600;color:#1a1a1a;line-height:1.3}
.modal-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.modal-close{font-size:13px;color:#6b6b6b;cursor:pointer;padding:4px 9px;border:1px solid #e5e5e5;border-radius:4px;background:#fff;font-family:'Inter',sans-serif}
.modal-close:hover{border-color:#1a1a1a;color:#1a1a1a}
.modal-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.meta-item{background:#f7f7f5;border-radius:6px;padding:10px 12px;border:1px solid #e5e5e5}
.meta-label{font-size:11px;color:#6b6b6b;margin-bottom:3px;font-weight:500;text-transform:uppercase;letter-spacing:0.04em}
.meta-value{font-size:13px;font-weight:500;color:#1a1a1a}
.modal-section{margin-bottom:14px}
.modal-section-label{font-size:11px;color:#6b6b6b;font-weight:500;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:6px}
.modal-link{font-size:13px;color:#1a1a1a;display:flex;align-items:center;gap:5px;text-decoration:underline;text-underline-offset:3px;word-break:break-all}
.modal-notes{font-size:13px;color:#4a4a4a;background:#f7f7f5;border:1px solid #e5e5e5;border-radius:6px;padding:12px;line-height:1.6}
.modal-empty{font-size:13px;color:#aaa}

/* POR PROYECTO */
.proy-section{margin-bottom:2rem}
.proy-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #1a1a1a}
.proy-name{font-size:16px;font-weight:600;color:#1a1a1a}
.proy-count{font-size:12px;color:#6b6b6b;background:#f5f5f5;border:1px solid #e5e5e5;border-radius:4px;padding:2px 8px}
.proy-tipo{font-size:11px;color:#6b6b6b;border:1px solid #e5e5e5;border-radius:4px;padding:2px 8px}
.proy-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* SEGUIMIENTO */
.seg-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.seg-card{background:#fff;border:1px solid #1a1a1a;border-radius:6px;padding:1.25rem}
.seg-card h3{font-size:13px;font-weight:600;color:#1a1a1a;margin-bottom:12px;display:flex;align-items:center;gap:7px}
.seg-row{display:flex;justify-content:space-between;align-items:flex-start;padding:9px 0;border-bottom:1px solid #f0f0f0;gap:8px}
.seg-row:last-child{border-bottom:none}
.seg-info{flex:1}
.seg-id{font-size:11px;color:#6b6b6b;margin-bottom:2px;font-weight:500}
.seg-tarea{font-size:13px;font-weight:500;color:#1a1a1a;line-height:1.3}
.seg-resp{font-size:12px;color:#6b6b6b;margin-top:2px}
.seg-right{text-align:right;flex-shrink:0}
.seg-fecha{font-size:11px;color:#6b6b6b;margin-top:4px}
.seg-dias-hoy{font-size:11px;padding:2px 7px;border-radius:4px;font-weight:500;border:1px solid;background:#fff0ee;color:#9b2c1a;border-color:#f5bdb5}
.seg-dias-pronto{font-size:11px;padding:2px 7px;border-radius:4px;font-weight:500;border:1px solid;background:#fff8ee;color:#8a4e0a;border-color:#f5dab5}
.no-data{font-size:13px;color:#aaa;padding:8px 0}

/* POR PERSONA */
.persona-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.persona-card{background:#fff;border:1px solid #1a1a1a;border-radius:6px;padding:14px 16px}
.persona-name{font-size:15px;font-weight:600;color:#1a1a1a;margin-bottom:3px}
.persona-count{font-size:12px;color:#6b6b6b;margin-bottom:12px}
.persona-task{display:flex;justify-content:space-between;align-items:flex-start;padding:8px 0;border-bottom:1px solid #f0f0f0;gap:8px;cursor:pointer}
.persona-task:last-child{border-bottom:none}
.persona-task:hover .pt-title{text-decoration:underline}
.pt-id{font-size:11px;color:#6b6b6b;margin-bottom:2px}
.pt-title{font-size:13px;font-weight:500;color:#1a1a1a;line-height:1.3}

/* SECTION HEADER */
.sec-label{font-size:11px;font-weight:600;color:#6b6b6b;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:1rem}

/* LOADING */
.loading{font-size:14px;color:#6b6b6b;padding:3rem 0;text-align:center}
.error-box{background:#fff0ee;border:1px solid #f5bdb5;color:#9b2c1a;border-radius:6px;padding:12px 16px;font-size:13px;margin-bottom:1rem;display:none}
</style>
</head>
<body>

<div class="topbar">
  <div class="page-title">Tablero · Área UX</div>
  <div class="page-sub">Subsecretaría de Promoción Humana · Ministerio de Capital Humano · <span id="ultima-act">Cargando...</span></div>
  <div class="tabs">
    <div class="tab active" onclick="cambiarTab(0)">Kanban</div>
    <div class="tab" onclick="cambiarTab(1)">Por proyecto</div>
    <div class="tab" onclick="cambiarTab(2)">Seguimiento semanal</div>
    <div class="tab" onclick="cambiarTab(3)">Por persona</div>
  </div>
</div>

<div class="error-box" id="error-box"></div>

<!-- TAB 0: KANBAN -->
<div class="content active" id="tab-0">
  <div class="loading" id="loading-0">Cargando datos...</div>
  <div id="kanban-content" style="display:none">
    <div class="summary-row" id="summary-row"></div>
    <div class="kanban" id="kanban-board"></div>
  </div>
</div>

<!-- TAB 1: POR PROYECTO -->
<div class="content" id="tab-1">
  <div class="loading" id="loading-1">Cargando datos...</div>
  <div id="proyecto-content" style="display:none"></div>
</div>

<!-- TAB 2: SEGUIMIENTO -->
<div class="content" id="tab-2">
  <div class="loading" id="loading-2">Cargando datos...</div>
  <div id="seg-content" style="display:none">
    <div class="summary-row" id="summary-row-2"></div>
    <div class="seg-grid" id="seg-grid"></div>
  </div>
</div>

<!-- TAB 3: POR PERSONA -->
<div class="content" id="tab-3">
  <div class="loading" id="loading-3">Cargando datos...</div>
  <div id="persona-content" style="display:none">
    <div class="summary-row" id="summary-row-3"></div>
    <div class="persona-grid" id="persona-grid"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="cerrarModal(event)">
  <div class="modal" id="modal-box">
    <div class="modal-header">
      <div>
        <div class="modal-proj" id="m-proj"></div>
        <div class="modal-title" id="m-title"></div>
      </div>
      <div class="modal-right">
        <span class="badge" id="m-estado"></span>
        <button class="modal-close" onclick="cerrarModal()">✕ cerrar</button>
      </div>
    </div>
    <div class="modal-meta">
      <div class="meta-item"><div class="meta-label">Responsable</div><div class="meta-value" id="m-resp"></div></div>
      <div class="meta-item"><div class="meta-label">Fecha límite</div><div class="meta-value" id="m-fecha"></div></div>
      <div class="meta-item"><div class="meta-label">Prioridad</div><div class="meta-value" id="m-prio"></div></div>
      <div class="meta-item"><div class="meta-label">Tipo</div><div class="meta-value" id="m-tipo"></div></div>
    </div>
    <div class="modal-section" id="m-link-sec">
      <div class="modal-section-label">Link</div>
      <div class="modal-link" id="m-link"></div>
    </div>
    <div class="modal-section" id="m-notes-sec">
      <div class="modal-section-label">Notas</div>
      <div class="modal-notes" id="m-notes"></div>
    </div>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbz-t6zcAtr7Nv-JpdT65Z-Sotzd6M7lSCbB1p9KEgK7OVNAQzfqDJLW5lufIIZtV_HkEQ/exec";
const ESTADOS = ["Pendiente","En curso","En revisión","Bloqueada","Completada"];
const COLORES_EST = {
  "Pendiente":"#5a5a5a","En curso":"#1a4fa0",
  "En revisión":"#8a4e0a","Bloqueada":"#9b2c1a","Completada":"#2a6a1a"
};
let TAREAS = [];

function esc(s){const d=document.createElement("div");d.textContent=s||"";return d.innerHTML}

function estBadge(est){
  const cls = "badge est-"+est.replace(/ /g,".");
  return `<span class="${cls}">${esc(est)}</span>`;
}

function prioBadge(p){
  return p ? `<span class="badge b-${esc(p)}">${esc(p)}</span>` : "";
}

function diasHasta(str){
  if(!str)return null;
  const p=str.split("/");
  if(p.length!==3)return null;
  const f=new Date(parseInt(p[2]),parseInt(p[1])-1,parseInt(p[0]));
  const h=new Date();h.setHours(0,0,0,0);
  return Math.ceil((f-h)/86400000);
}

// ── TABS ──────────────────────────────────────────────────────
function cambiarTab(idx){
  document.querySelectorAll(".tab").forEach((t,i)=>t.classList.toggle("active",i===idx));
  document.querySelectorAll(".content").forEach((c,i)=>c.classList.toggle("active",i===idx));
}

// ── MODAL ─────────────────────────────────────────────────────
function abrirModal(t){
  document.getElementById("m-proj").textContent = t.proyecto+" · "+t.id;
  document.getElementById("m-title").textContent = t.tarea;
  document.getElementById("m-estado").className = "badge est-"+t.estado.replace(/ /g,".");
  document.getElementById("m-estado").textContent = t.estado;
  document.getElementById("m-resp").textContent = t.responsable||"Sin asignar";
  document.getElementById("m-fecha").textContent = t.fecha||"Sin fecha";
  document.getElementById("m-prio").textContent = t.prioridad||"—";
  document.getElementById("m-tipo").textContent = t.tipo||"—";

  const linkSec = document.getElementById("m-link-sec");
  const linkEl  = document.getElementById("m-link");
  if(t.links){
    linkSec.style.display="block";
    linkEl.innerHTML = `<a href="${esc(t.links)}" target="_blank" style="color:#1a1a1a;display:flex;align-items:center;gap:5px">↗ ${esc(t.links)}</a>`;
  } else { linkSec.style.display="none"; }

  const notesSec = document.getElementById("m-notes-sec");
  const notesEl  = document.getElementById("m-notes");
  if(t.notas){ notesSec.style.display="block"; notesEl.textContent=t.notas; }
  else { notesSec.style.display="none"; }

  document.getElementById("modal-overlay").classList.add("open");
}

function cerrarModal(e){
  if(!e || e.target===document.getElementById("modal-overlay") || e.target.classList.contains("modal-close")){
    document.getElementById("modal-overlay").classList.remove("open");
  }
}
document.addEventListener("keydown",e=>{if(e.key==="Escape")cerrarModal();});

// ── RENDER FUNCIONES ──────────────────────────────────────────
function renderSummary(id, tareas){
  const conteos={};ESTADOS.forEach(e=>conteos[e]=0);
  tareas.forEach(t=>{if(conteos[t.estado]!==undefined)conteos[t.estado]++});
  document.getElementById(id).innerHTML=ESTADOS.map(e=>`
    <div class="scard">
      <div class="scard-num" style="color:${COLORES_EST[e]}">${conteos[e]}</div>
      <div class="scard-lbl">${e}</div>
    </div>`).join("");
}

function renderKanban(tareas){
  renderSummary("summary-row", tareas);
  document.getElementById("kanban-board").innerHTML=ESTADOS.map(estado=>{
    const ts=tareas.filter(t=>t.estado===estado);
    const cards=ts.length ? ts.map(t=>`
      <div class="kcard ${estado==="Bloqueada"?"bloq":""} ${estado==="Completada"?"done":""}"
           onclick="abrirModal(TAREAS.find(x=>x.id==='${esc(t.id)}'))">
        <div class="kcard-proj">${esc(t.proyecto)}</div>
        <div class="kcard-title">${esc(t.id)} · ${esc(t.tarea)}</div>
        <div class="kcard-footer">
          <span class="kcard-resp">${esc(t.responsable)}</span>
          ${prioBadge(t.prioridad)}
        </div>
        <div class="kcard-more">↓ ver notas y links</div>
      </div>`).join("")
    : `<div class="empty-col">Sin tareas</div>`;
    return `<div class="kcol">
      <div class="kcol-title" style="color:${COLORES_EST[estado]}">
        <span>${estado}</span><span class="kcol-count">${ts.length}</span>
      </div>${cards}</div>`;
  }).join("");
  document.getElementById("loading-0").style.display="none";
  document.getElementById("kanban-content").style.display="block";
}

function renderPorProyecto(tareas){
  const porProy={};
  tareas.forEach(t=>{
    if(!porProy[t.proyecto])porProy[t.proyecto]={tipo:t.tipo,tareas:[]};
    porProy[t.proyecto].tareas.push(t);
  });
  const html=Object.entries(porProy).map(([proy,data])=>{
    const cards=data.tareas.map(t=>`
      <div class="kcard" onclick="abrirModal(TAREAS.find(x=>x.id==='${esc(t.id)}'))">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          ${estBadge(t.estado)} ${prioBadge(t.prioridad)}
        </div>
        <div class="kcard-title">${esc(t.id)} · ${esc(t.tarea)}</div>
        <div class="kcard-footer">
          <span class="kcard-resp">${esc(t.responsable)}</span>
          <span style="font-size:11px;color:#aaa">${esc(t.fecha||"")}</span>
        </div>
        <div class="kcard-more">↓ ver notas y links</div>
      </div>`).join("");
    return `<div class="proy-section">
      <div class="proy-header">
        <span class="proy-name">${esc(proy)}</span>
        <span class="proy-count">${data.tareas.length} tarea${data.tareas.length!==1?"s":""}</span>
        <span class="proy-tipo">${esc(data.tipo)}</span>
      </div>
      <div class="proy-grid">${cards}</div>
    </div>`;
  }).join("");
  document.getElementById("proyecto-content").innerHTML=html;
  document.getElementById("loading-1").style.display="none";
  document.getElementById("proyecto-content").style.display="block";
}

function renderSeguimiento(tareas){
  renderSummary("summary-row-2", tareas);
  const activas=tareas.filter(t=>t.estado==="En curso"||t.estado==="Bloqueada")
    .sort((a,b)=>a.estado==="Bloqueada"?-1:1);
  const vencen=tareas.filter(t=>t.estado!=="Completada"&&t.fecha)
    .map(t=>({...t,dias:diasHasta(t.fecha)}))
    .filter(t=>t.dias!==null&&t.dias>=0&&t.dias<=7)
    .sort((a,b)=>a.dias-b.dias);

  document.getElementById("seg-grid").innerHTML=`
    <div class="seg-card">
      <h3>En curso y bloqueadas <span style="font-size:12px;color:#6b6b6b;font-weight:400">(${activas.length})</span></h3>
      ${activas.length?activas.map(t=>`
        <div class="seg-row" onclick="abrirModal(TAREAS.find(x=>x.id==='${esc(t.id)}'))" style="cursor:pointer">
          <div class="seg-info">
            <div class="seg-id">${esc(t.id)} · ${esc(t.proyecto)}</div>
            <div class="seg-tarea">${esc(t.tarea)}</div>
            <div class="seg-resp">${esc(t.responsable)}</div>
          </div>
          <div class="seg-right">
            ${estBadge(t.estado)}
            ${t.fecha?`<div class="seg-fecha">${esc(t.fecha)}</div>`:""}
          </div>
        </div>`).join(""):`<div class="no-data">Sin tareas activas</div>`}
    </div>
    <div class="seg-card">
      <h3>Vencen esta semana <span style="font-size:12px;color:#6b6b6b;font-weight:400">(${vencen.length})</span></h3>
      ${vencen.length?vencen.map(t=>`
        <div class="seg-row" onclick="abrirModal(TAREAS.find(x=>x.id==='${esc(t.id)}'))" style="cursor:pointer">
          <div class="seg-info">
            <div class="seg-id">${esc(t.id)} · ${esc(t.proyecto)}</div>
            <div class="seg-tarea">${esc(t.tarea)}</div>
            <div class="seg-resp">${esc(t.responsable)}</div>
          </div>
          <div class="seg-right">
            <span class="${t.dias===0?"seg-dias-hoy":"seg-dias-pronto"}">${t.dias===0?"Hoy":"En "+t.dias+" d"}</span>
            <div class="seg-fecha">${esc(t.fecha)}</div>
          </div>
        </div>`).join(""):`<div class="no-data">Sin vencimientos esta semana</div>`}
    </div>`;
  document.getElementById("loading-2").style.display="none";
  document.getElementById("seg-content").style.display="block";
}

function renderPorPersona(tareas){
  renderSummary("summary-row-3", tareas);
  const porPersona={};
  tareas.forEach(t=>{
    if(t.estado==="Completada")return;
    t.responsable.split(",").map(n=>n.trim()).filter(Boolean).forEach(n=>{
      if(!porPersona[n])porPersona[n]=[];
      porPersona[n].push(t);
    });
  });
  const personas=Object.entries(porPersona).sort((a,b)=>b[1].length-a[1].length);
  document.getElementById("persona-grid").innerHTML=personas.map(([nombre,ts])=>`
    <div class="persona-card">
      <div class="persona-name">${esc(nombre)}</div>
      <div class="persona-count">${ts.length} tarea${ts.length!==1?"s":""} activa${ts.length!==1?"s":""}</div>
      ${ts.map(t=>`
        <div class="persona-task" onclick="abrirModal(TAREAS.find(x=>x.id==='${esc(t.id)}'))">
          <div>
            <div class="pt-id">${esc(t.id)} · ${esc(t.proyecto)}</div>
            <div class="pt-title">${esc(t.tarea)}</div>
          </div>
          <div style="flex-shrink:0">${estBadge(t.estado)}</div>
        </div>`).join("")}
    </div>`).join("");
  document.getElementById("loading-3").style.display="none";
  document.getElementById("persona-content").style.display="block";
}

// ── CARGA DE DATOS (JSONP) ─────────────────────────────────────
function cargar(){
  window.handleData=function(data){
    TAREAS=data.tareas||[];
    document.getElementById("ultima-act").textContent="Actualizado: "+(data.actualizadoTexto||"—");
    renderKanban(TAREAS);
    renderPorProyecto(TAREAS);
    renderSeguimiento(TAREAS);
    renderPorPersona(TAREAS);
  };
  const s=document.createElement("script");
  s.src=API_URL+"?callback=handleData&t="+Date.now();
  s.onerror=function(){
    const eb=document.getElementById("error-box");
    eb.textContent="No se pudieron cargar los datos. Verificá que el Apps Script esté publicado como app web pública.";
    eb.style.display="block";
    document.querySelectorAll(".loading").forEach(l=>l.style.display="none");
  };
  document.head.appendChild(s);
}

cargar();
</script>
</body>
</html>
